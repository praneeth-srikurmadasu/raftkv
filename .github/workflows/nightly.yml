name: Nightly

# The long runs (SPEC §9.9): 10,000 seeds for every chaos suite, a coverage report, and a
# 5-minute Jepsen-lite run against real processes. Also startable by hand from the Actions tab.
on:
  schedule:
    - cron: '17 21 * * *'   # 02:47 in India (UTC+05:30)
  workflow_dispatch:

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: All tests with 10,000 seeds per chaos suite, with coverage
        run: ./mvnw -B -ntp verify -Pcoverage "-Draftkv.seeds=10000"
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  jepsen-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: ./mvnw -B -ntp -DskipTests test-compile
      - name: Jepsen-lite, 5 minutes
        run: java -cp target/classes:target/test-classes dev.raftkv.server.JepsenLite 300
